# Builds and tests the site on Linux with Node, as a host would, for every pull
# request and every push to master.
name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The oldest Node the site supports (package.json engines).
          node-version: 22.18.0
      - name: Install
        run: npx -y pnpm@12.10.1 install --frozen-lockfile
      - name: Type check and build
        run: npx -y pnpm@12.10.1 run build
      - name: Test
        run: npx -y pnpm@12.10.1 test
